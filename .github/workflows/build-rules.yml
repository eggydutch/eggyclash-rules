name: Build SRS Rule Sets

on:
  push:
    branches:
      - main
    paths:
      - "*.json"
      - ".github/workflows/build-rules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL \
            --connect-timeout 10 \
            --max-time 30 \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.tag_name')

          VERSION_NO_V="${VERSION#v}"

          echo "Installing sing-box ${VERSION}"

          curl -fL \
            --connect-timeout 10 \
            --max-time 60 \
            "https://github.com/SagerNet/sing-box/releases/download/${VERSION}/sing-box-${VERSION_NO_V}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tar.gz

          mkdir -p /tmp/sing-box

          tar -xzf /tmp/sing-box.tar.gz \
            -C /tmp/sing-box

          sudo install -m 0755 \
            "$(find /tmp/sing-box -type f -name sing-box | head -n 1)" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Build JSON to SRS
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          for file in *.json; do
            name="${file%.json}"

            echo "========================================"
            echo "Building ${file} -> ${name}.srs"
            echo "========================================"

            jq empty "$file"

            sing-box rule-set compile \
              --output "${name}.srs" \
              "$file"

            ls -lh "${name}.srs"
          done

      - name: Commit generated SRS files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.srs'

          if git diff --cached --quiet; then
            echo "No SRS files changed."
            exit 0
          fi

          git commit -m "build: update SRS rule sets"
          git push
